name: XZRecruiter production verification
on:
  push:
    branches: [production-rebuild-v1, main, step4-global-enterprise-ats]
  pull_request:
    branches: [main, step2-global-foundation, step3-agency-onboarding]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:step2
      - run: npm run test:step3
      - run: npm run test:step4
      - run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/postgres
