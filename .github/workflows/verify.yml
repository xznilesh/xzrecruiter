name: XZRecruiter production verification
on:
  push:
    branches: [production-rebuild-v1, main, step6-ai-submission-pack-am-quality-gate, step7-enterprise-multitenant-security-data-foundation-v2, step2-global-foundation, step3-agency-onboarding, step4-global-enterprise-ats, step4-closeout-stage-guard, step4-closeout-public-apply, step4-final-quality, step5-recruitment-crm, step5-ai-assisted-human-screening]
  pull_request:
    branches: [main, step6-ai-submission-pack-am-quality-gate, step2-global-foundation, step3-agency-onboarding, step4-global-enterprise-ats]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run test:step2
      - run: npm run test:step3
      - run: npm run test:step4
      - run: npm run test:step4:closeout
      - run: npm run test:step4:performance
      - run: npm run test:step4:stage-guard
      - run: npm run test:step4:public-apply
      - run: npm run test:step4:candidate360
      - run: npm run test:step4:job360
      - run: npm run test:step5
      - run: npm run test:step5:security
      - run: npm run test:step5:portals
      - run: npm run test:step5:performance
      - run: npm run test:step5:screening
      - run: npm run test:step6
      - run: npm run test:step7
      - run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/postgres
