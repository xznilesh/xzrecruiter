name: Bootstrap ReqRadar source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand source bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/reqradar-src
          cat .bootstrap/seg_* > /tmp/reqradar-source.b64
          base64 -d /tmp/reqradar-source.b64 > /tmp/reqradar-source.tar.xz
          tar -xJf /tmp/reqradar-source.tar.xz -C /tmp/reqradar-src
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .bootstrap ! -name .github -exec rm -rf {} +
          rsync -a --delete --exclude '.git' /tmp/reqradar-src/ ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy ReqRadar Step 20.1 full source'
          git push origin HEAD:main
