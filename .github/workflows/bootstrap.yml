name: Analyze XZRecruiter source archives

on:
  push:
    branches: [xzrecruiter-source-verify]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze archive candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, glob, hashlib, os, subprocess

          def analyze(name, files):
              raw=''.join(Path(f).read_text() for f in files)
              s=''.join(ch for ch in raw if ch.isalnum() or ch in '+/=')
              print(f'=== {name} ===')
              print('files=', files)
              print('len=',len(s),'mod4=',len(s)%4,'prefix=',s[:24],'suffix=',s[-24:])
              eq=[i for i,c in enumerate(s) if c=='=']
              print('padding_count=',len(eq),'first_padding=',eq[:10],'last_padding=',eq[-10:])
              try:
                  b=base64.b64decode(s, validate=True)
                  print('strict_base64=PASS decoded=',len(b),'magic=',b[:8].hex(),'sha256=',hashlib.sha256(b).hexdigest())
                  out=f'/tmp/{name}.bin'
                  Path(out).write_bytes(b)
                  p=subprocess.run(['xz','-t',out],capture_output=True,text=True)
                  print('xz_test=',p.returncode,p.stderr.strip())
                  if p.returncode==0:
                      q=subprocess.run(['tar','-tJf',out],capture_output=True,text=True)
                      lines=q.stdout.splitlines()
                      print('tar_test=',q.returncode,'file_count=',len(lines))
                      print('tar_first=',lines[:30])
              except Exception as e:
                  print('strict_base64=FAIL',repr(e))

          analyze('good_00_01', ['.bootstrap/good_00','.bootstrap/good_01'])
          analyze('good_all', sorted(glob.glob('.bootstrap/good_*')))
          analyze('pkg_all', sorted(glob.glob('.bootstrap/pkg_*')))
          analyze('chunk_all', sorted(glob.glob('.bootstrap/chunk_*')))
          analyze('source_all', sorted(glob.glob('.bootstrap/source_*')))
          analyze('runtime_all', sorted(glob.glob('.bootstrap/runtime_*')))
          PY
