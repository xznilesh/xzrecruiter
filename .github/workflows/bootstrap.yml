name: Diagnose XZRecruiter source bundle

on:
  push:
    branches: [xzrecruiter-source-verify]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose bundle chunks
        shell: bash
        run: |
          set -euo pipefail
          for f in .bootstrap/good_*; do
            echo "=== $f ==="
            wc -c "$f"
            printf 'head='; head -c 48 "$f"; echo
            printf 'tail='; tail -c 48 "$f"; echo
            printf 'nonbase64='; LC_ALL=C grep -oba '[^A-Za-z0-9+/=\r\n]' "$f" | head -n 5 || true
            printf 'validchars='; tr -cd 'A-Za-z0-9+/=' < "$f" | wc -c
          done
          cat .bootstrap/good_* | tr -cd 'A-Za-z0-9+/=' > /tmp/clean.b64
          echo "=== cleaned aggregate ==="
          wc -c /tmp/clean.b64
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/clean.b64').read_text()
          print('length_mod_4=', len(s)%4)
          print('first_padding_index=', s.find('='))
          print('last_64=', s[-64:])
          PY
