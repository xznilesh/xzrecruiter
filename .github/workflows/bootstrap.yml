name: Verify and expand XZRecruiter source

on:
  push:
    branches: [xzrecruiter-source-verify]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and expand source bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xzrecruiter-src
          cat .bootstrap/good_* > /tmp/xzrecruiter-source.b64
          base64 --decode --ignore-garbage /tmp/xzrecruiter-source.b64 > /tmp/xzrecruiter-source.tar.xz
          xz -t /tmp/xzrecruiter-source.tar.xz
          tar -tJf /tmp/xzrecruiter-source.tar.xz >/tmp/xzrecruiter-files.txt
          tar -xJf /tmp/xzrecruiter-source.tar.xz -C /tmp/xzrecruiter-src
          test -f /tmp/xzrecruiter-src/package.json
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .bootstrap ! -name .github -exec rm -rf {} +
          rsync -a --delete --exclude '.git' /tmp/xzrecruiter-src/ ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit expanded source to verification branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Expand verified XZRecruiter source'
          git push origin HEAD:xzrecruiter-source-verify
